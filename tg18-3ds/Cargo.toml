[package]
name = "tg18-3ds"
version = "0.1.0"
edition = "2021"
authors = ["maaartennn"]
description = "Tamagotchi Meets/ON emulator for Nintendo 3DS"

[features]
audio-debug = []

[dependencies]
jpeg-encoder = "0.6.1"
ctru-rs = { git = "https://github.com/rust3ds/ctru-rs" }
tg18-core = { path = "../tg18-emu-main/core" }

[package.metadata.cargo-3ds]
app_title = "Meets On 3DS"
app_description = "Tamagotchi Meets/ON emulator for Nintendo 3DS"
app_author = "maaartennn"
app_icon = "icon.png"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
